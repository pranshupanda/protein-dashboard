<text x="40" y="456" font-size="12.5" fill="#e9eadf" font-weight="normal" text-anchor="start">Both loops beat the seed program on average and beat both classical optimizers, but Qwen and gpt-oss cannot be told apart at n = 5.</text>
<text x="40" y="478" font-size="12.5" fill="#e9eadf" font-weight="normal" text-anchor="start">A Qwen program matches random search given about 1418 queries per problem (gpt-oss: about 735). Qwen edits the whole program; gpt-oss mostly tweaks constants.</text>
<text x="40" y="500" font-size="12.5" fill="#a7ab9b" font-weight="normal" text-anchor="start">Grey Claude rows are references, not a fair baseline: written with knowledge of the evaluator (me) or with the project notes in context (Opus subagent).</text>
