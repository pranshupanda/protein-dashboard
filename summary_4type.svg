<text x="790" y="474" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start">Turns kept as a new best:</text>
<text x="790" y="494" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">Qwen 11 of 200 (5.5%), gpt-oss 7 of 200 (3.5%)</text>
<text x="790" y="514" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">Turns with no usable edit: Qwen 24, gpt-oss 4</text>
<line x1="36" y1="558" x2="1164" y2="558" stroke="#e4e3df"/>
<text x="36" y="574" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">- On average both loops beat the unchanged seed program and both classical optimizers (2 of 5 gpt-oss seeds do not beat the seed). A Qwen program matches random search given about 1418 queries per problem (gpt-oss: about 735).</text>
<text x="36" y="596" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">- Qwen and gpt-oss are not distinguishable at n = 5: run-to-run spread is 0.013 (Qwen) and 0.033 (gpt-oss). Almost all of the gain is on the easiest problem type.</text>
<text x="36" y="618" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">- Qwen edits across the whole program; gpt-oss mostly tweaks constants. Very few edits pay off for either model, and the loops' 4-problem practice score is noisy.</text>
<text x="36" y="640" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">Note: Claude-written rows are references, not a fair baseline: written with knowledge of the evaluator (me) or with this project's notes in context (Opus subagent).</text>
<text x="36" y="662" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">Note: the practice set is one problem per type. Only two simple classical baselines were run (no TuRBO).</text>
</svg>
